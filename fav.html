<!DOCTYPE html>
<html>
<head>
    <script src="js/artists.js"></script>
    <style>
        body {
            background-color: rgb(249, 243, 188);
            margin: 0;     
        }
        .nav {
            background-color: rgb(51, 99, 51);
            color:rgb(249, 243, 188);
            text-align: right;
            padding: 10px 10px;
            font-family:'Trebuchet MS';
            font-size: larger;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav a,
        .nav a:visited {
            color:rgb(249, 243, 188);
        }
        .nav a:hover {
            color:rgb(227, 212, 80);
            margin: 0 10px;
        }
         .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 40px;
            margin-top: 80px;
            padding: 0 40px;
        }

        .image-container {
            width: 250px;
        }
        .image-container img {
            display:block;
        }
        .heart-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 5px;
        }
        .favorite-button {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid #f13500;
            background-color: white;
            
            color: #f13500;
            font-size: 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
        }
        .artist-info {
            width: 250px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .artist-info p {
            margin-bottom: 5px;
        }
        .artist-box > p {
            margin-top: 0;
        }
        .empty-message {
            width: 100%;
            text-align: center;
        }
    </style>
</head>
    <body>
        <div class="nav">
            <a href="home.html">
                <img src="images/logo.png" width="150">
            </a>
            <div>Favorites</div>
            <div class="nava">
                <a href="home.html">Home ⌂︎</a> |
                <a href="fav.html">Favorites ♡</a>
            </div>
        </div>
        <div class="container" id="favorites-container"></div>
        <script>
            const favorites = JSON.parse(localStorage.getItem("favorites")) || [];
            const favoriteIds = favorites.map(favorite => String(favorite.id));
            const favartists = artists.filter(artist => favoriteIds.includes(String(artist.id)));
            
            const container = document.getElementById("favorites-container");
            favartists.forEach(artist => {
                container.innerHTML += `
                    <div class="artist-box">
                        <div class="image-container">
                            <img src="images/placeholder.png" width="250" alt="${artist.name}">
                        </div>
                        <div class="artist-info">
                            <p><b>${artist.name}</b></p>
                            <div class="heart-container">
                                <button 
                                    class="favorite-button"
                                    type="button"
                                    onclick="removeFromFavorites(${artist.id})">
                                    ♥
                                </button>
                            </div>
                        </div>
                        <p>${artist.information}</p>
                    </div>
                `;
            });
            if (favartists.length === 0) {
                container.innerHTML = "<p class='empty-message'>You have not favorited any artists.</p>";
            }
            function removeFromFavorites(artistId) {
                let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
                favorites = favorites.filter(
                    favorite => String(favorite.id) !== String(artistId)
                );
                localStorage.setItem("favorites", JSON.stringify(favorites));
                location.reload();
            }
        </script>
    </body>
     
</html>
