<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: rgb(249, 243, 188);
            margin: 0;
        }
        .nav {
            background-color: rgb(51, 99, 51);
            color:rgb(249, 243, 188);
            text-align: right;
            padding: 10px 10px;
            font-family:'Trebuchet MS';
            font-size: larger;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav a,
        .nav a:visited {
            color:rgb(249, 243, 188);
        }
        .nav a:hover {
            color:rgb(227, 212, 80);
            margin: 0 10px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 100px;
            margin-top: 40px;
            padding: 0 100px;
        }

        .image-container {
            width:100%
        }
        .image-container img {
            display:block;
            width:100%;
            height:auto;
        }
        .heart-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 5px;
        }
        .favorite-button {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid #f13500;
            background-color: white;
            
            color: #f13500;
            font-size: 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
        }

        .favorite-button.favorited {
            color: #f13500;
        }
        .artist-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Trebuchet MS';
            font-size: 30px;
            margin-top: 0px;
        }
        .artist-info p {
            margin-bottom: 5px;
        }
        .artist-box > p {
            width: 100%;
            font-family: 'Trebuchet MS';
            margin-top:5px;
    </style>
    <script src="js/artists.js"></script>
</head>
    <body>
        <!--For the like button functionality -->
        <script>
            function getFavorites() {
                const saved = localStorage.getItem("favorites");
                return saved ? JSON.parse(saved) : [];
            }
            function toggleFavorite(button) {
                let favorites = getFavorites();
                const id = button.getAttribute("data-artist-id");
                const name = button.getAttribute("data-artist-name");
                const index = favorites.findIndex(fav => fav.id === id);
                if (index !== -1) {
                    favorites.splice(index, 1);
                } else {
                    favorites.push({ id: id, name: name });
                }
                localStorage.setItem("favorites", JSON.stringify(favorites));
                updateFavoriteButtons();
            }
            
            function updateFavoriteButtons() {
                let favorites = getFavorites();
                document.querySelectorAll(".favorite-button").forEach(button => {
                    let artistId = button.getAttribute("data-artist-id");
                    const isFavorited = favorites.some(fav => fav.id === artistId);
                    if (isFavorited) {
                        button.classList.add("favorited");
                        button.innerHTML = "♥";
                    } else {
                        button.classList.remove("favorited");
                        button.innerHTML = "♡";
                    }
                });
            }

            window.onload = function() {
                updateFavoriteButtons();
            }
        </script>
        <!-- navigation bar-->
        <div class="nav">
            <a href="home.html">
                <img src="images/logo.png" width="150">
            </a>
            <div>Home</div>
            <div class="nava">
                <a href="home.html">Home ⌂︎</a> |
                <a href="fav.html">Favorites ♡</a>
            </div>
        </div>

        <!--header-->
        <div>
            <h1 style="font-family: Trebuchet MS; color: rgb(51, 99, 51); margin-left: 100px;
            margin-bottom:0px">
                Explore Artists 🎵
            </h1>
            <h3 style="font-family: Trebuchet MS; color: rgb(78, 128, 78); margin-left: 100px;
            margin-top:0px">
                Discover our featured artists! Browse our collection of over 20 different artists from
                a variety of genres. Find your new favorite artist today!
            </h3>
        </div>

        <!-- displaying artists-->
        <div class="container" id="artists-container">
        </div>
        <script>
            const container = document.getElementById("artists-container");
            artists.forEach(artist => {
                container.innerHTML += `
                    <div class="artist-box">
                        <div class="image-container">
                            <img src="${artist.image}" width="250">
                        </div>
                        <div class="artist-info">
                            <p><b>${artist.name}</b></p>

                            <div class="heart-container">
                                <button class="favorite-button" type="button" data-artist-id="${artist.id}" data-artist-name="${artist.name}" onclick="toggleFavorite(this)">♡</button>
                            </div>
                        </div>
                        <p>${artist.information}</p>
                    </div>   
                `;
            });
        </script>  
    </body>
</html>
