<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: rgb(249, 243, 188);
            margin: 0;     
        }
        .nav {
            background-color: rgb(51, 99, 51);
            color:rgb(249, 243, 188);
            text-align: right;
            padding: 20px 20px;
            font-family:'Trebuchet MS';
            font-size: x-large;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav a,
        .nav a:visited {
            color:rgb(249, 243, 188);
        }
        .nav a:hover {
            color:rgb(227, 212, 80);
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 40px;
            margin-top: 80px;
            padding: 0 40px;
        }

        .image-container {
            width: 250px;
            position: relative;
        }
        .image-container img {
            display:block;
            width: 100%;
            height:auto;
        }
        .heart-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 5px;
        }
        .favorite-button {
            position: absolute;
            bottom: 20px;
            right: 15px;

            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid #f13500;
            background-color: white;
            
            color: #f13500;
            font-size: 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
        }
        .artist-info {
            width: 250px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .artist-info p {
            margin-bottom: 5px;
        }
        .artist-box > p {
            margin-top: 0;
        }
        .empty-message {
            width: 100%;
            font-family: 'Trebuchet MS';
            font-size: xx-large;
            font-weight: bold;
            text-align: center;
            color: rgb(42, 86, 42);
        }
    </style>
</head>
    <body>
        <div class="nav">
            <a href="{{ url_for('home') }}" class="logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" width="180">
            </a>
            <div>Favorites</div>
            <div class="nava">
                <a href="{{ url_for('home') }}">Home ⌂︎</a> |
                <a href="{{ url_for('explore_page') }}">Explore</a> |
                <a href="{{ url_for('favorites_page') }}">Favorites ♡</a>
            </div>
        </div>
        <div class="container" id="favorites-container"></div>
        <script>
            const favorites = JSON.parse(localStorage.getItem("favorites")) || [];
            const container = document.getElementById("favorites-container");
            const placeholder = "{{ url_for('static', filename='images/placeholder.png') }}";

            favorites.forEach(artist => {
                container.innerHTML += `
                    <div class="artist-box">
                        <div class="image-container">
                            <img src="${artist.image || placeholder}" width="250" alt="${artist.name}">
                            <div class="heart-container">
                                <button 
                                    class="favorite-button"
                                    type="button"
                                    onclick="removeFromFavorites('${artist.id}')">
                                    ♥
                                </button>
                            </div>
                            </div>
                        <div class="artist-info">
                            <p><b>${artist.name}</b></p>
                            
                        </div>
                    </div>
                `;
            });
            if (favorites.length === 0) {
                container.innerHTML = "<p class='empty-message'>You have not favorited any artists.</p>";
            }
            function removeFromFavorites(artistId) {
                let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
                favorites = favorites.filter(
                    favorite => String(favorite.id) !== String(artistId)
                );
                localStorage.setItem("favorites", JSON.stringify(favorites));
                location.reload();
            }
        </script>
    </body>
     
</html>
