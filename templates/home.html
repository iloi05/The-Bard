<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: rgb(249, 243, 188);
            margin: 0;
        }
        .nav {
            background-color: rgb(51, 99, 51);
            color:rgb(249, 243, 188);
            text-align: right;
            padding: 10px 10px;
            font-family:'Trebuchet MS';
            font-size: larger;

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            margin-right: auto;
        }
        .logo img {
            display: block;
            width: 150px;
        }
        .nav a,
        .nav a:visited {
            color:rgb(249, 243, 188);
        }
        .nav a:hover {
            color:rgb(227, 212, 80);
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            padding: 20px;
        }

        .image-container {
            width: 600px;
            position: relative;
        }
        .image-container img {
            display:block;
            width: 100%;
            height:auto;
        }
        .heart-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 5px;
        }
        .favorite-button {
            position: absolute;
            bottom: 20px;
            right: 15px;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid #f13500;
            background-color: white;
            
            color: #f13500;
            font-size: 28px;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
        }

        .favorite-button.favorited {
            color: #f13500;
        }
        .artist-info {
            width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .artist-info p {
            margin-bottom: 45px;
            font-size: 35px;
        }
        .artist-box > p {
            font-size: 25px;
            margin-top: 0;
        }
    </style>
</head>
    <body>
        <script>
            function getFavorites() {
                const saved = localStorage.getItem("favorites");
                return saved ? JSON.parse(saved) : [];
            }
            function toggleFavorite(button) {
                let favorites = getFavorites();
                const id = button.getAttribute("data-artist-id");
                const name = button.getAttribute("data-artist-name");
                const index = favorites.findIndex(fav => fav.id === id);
                if (index !== -1) {
                    favorites.splice(index, 1);
                } else {
                    favorites.push({ id: id, name: name });
                }
                localStorage.setItem("favorites", JSON.stringify(favorites));
                updateFavoriteButtons();
            }
            
            function updateFavoriteButtons() {
                let favorites = getFavorites();
                document.querySelectorAll(".favorite-button").forEach(button => {
                    let artistId = button.getAttribute("data-artist-id");
                    const isFavorited = favorites.some(fav => fav.id === artistId);
                    if (isFavorited) {
                        button.classList.add("favorited");
                        button.innerHTML = "♥";
                    } else {
                        button.classList.remove("favorited");
                        button.innerHTML = "♡";
                    }
                });
            }

            window.onload = function() {
                updateFavoriteButtons();
            }
        </script>
        <div class="nav">
            <a href="{{ url_for('home') }}" class="logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" width="150">
            </a>
            <div>Home</div>
            <div class="nava">
                <a href="{{ url_for('home') }}">Home ⌂︎</a> |
                <a href="{{ url_for('favorites_page') }}">Favorites ♡</a>
            </div>
        </div>

        
        <div class="container">
           {% for artist in artists %}
           <div class="artist-box">
                <div class="image-container">
                    <img src="{{ url_for('static', filename='images/placeholder.png') }}" width="250">
                    <div class="heart-container">
                        <button class="favorite-button" type="button" data-artist-id="{{ artist.id }}" data-artist-name="{{ artist.name }}" onclick="toggleFavorite(this)">♡</button>
                    </div>
                </div>
                <div class="artist-info">
                    <p><b>{{ artist.name }}</b></p>
                    
                </div>
                <p>{{ artist.country or 'Unknown' }}</p>
                <p>{{ artist.type or 'Unknown' }}</p>
            </div>
            {% endfor %}
        </div>
        
    </body>
</html>
