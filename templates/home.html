<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: rgb(249, 243, 188);
            margin: 0;
            
            
        }
        .nav {
            background-color: rgb(51, 99, 51);
            color:rgb(249, 243, 188);
            text-align: right;
            padding: 10px 10px;
            font-family:'Trebuchet MS';
            font-size: larger;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav a,
        .nav a:visited {
            color:rgb(249, 243, 188);
        }
        .nav a:hover {
            color:rgb(227, 212, 80);
            margin: 0 10px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 120px;
            margin-top: 80px;
        }

        .image-container {
            width: 250px;
        }
        .image-container img {
            display:block;
        }
        .favorite-button {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid #f13500;
            background-color: white;
            
            color: #f13500;
            font-size: 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
        }

        .favorite-button.favorited {
            color: #f13500;
        }
    </style>
</head>
    <body>
        <script>
            function toggleFavorite(button) {
                button.classList.toggle("favorited");

                if (button.classList.contains("favorited")) {
                    button.innerHTML = "♥";
                } else {
                    button.innerHTML = "♡";
                }
            }
        </script>
        <div class="nav">
            <a href="home.html">
                <img src="{{ url_for('static', filename='images/logo.png') }}" width="150">
            </a>
            <div>Home</div>
            <div class="nava">
                <a href="{{ url_for('home') }}">Home ⌂︎</a> |
                <a href="{{ url_for('favorites_page') }}">Favorites ♡</a>
            </div>
        </div>

        
        <div class="container">
           {% for artist in artists %}
           <div class="artist-box">
                <img src="{{ url_for('static', filename='images/placeholder.png') }}" width="250">
                <div style="display: flex">
                    <p><b>{{ artist.name }}</b></p>
                    <form class="/favorite-form" action="/favorite/" method="POST" style="margin-left: auto;">
                        <button class="favorite-button" type="button" onclick="toggleFavorite(this)">♡</button> 
                    </form>
                </div>

                <p>{{ artist.information }}</p>
            </div>
            {% endfor %}
        </div>
        
    </body>
</html>
